controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    # Başlangıçta yüklenecek kontrolcüler
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Joint State Broadcaster Yapılandırması
joint_state_broadcaster:
  ros__parameters:
    joints:
      - right_front_wheel_joint
      - right_rear_wheel_joint
      - left_front_wheel_joint
      - left_rear_wheel_joint
      - arm_joint1
      - arm_joint2
      - arm_joint3
      - arm_joint4
      - arm_joint5
    interfaces:
      - position
      - velocity

# Kol Kontrolcüsü Yapılandırması (Joint Trajectory Controller)
arm_controller:
  ros__parameters:
    joints:
      - arm_joint1
      - arm_joint2
      - arm_joint3
      - arm_joint4
      - arm_joint5
    
    command_interfaces:
      - position
    
    state_interfaces:
      - position
      - velocity
    
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    
    allow_partial_joints_goal: false
    open_loop_control: false
    
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

# Diferansiyel Sürüş Kontrolcüsü Yapılandırması
diff_drive_controller:
  ros__parameters:
    # Tekerlek jointleri
    left_wheel_names: ["left_front_wheel_joint", "left_rear_wheel_joint"]
    right_wheel_names: ["right_front_wheel_joint", "right_rear_wheel_joint"]

    # Tekerlek aralığı ve yarıçapı (rover'ınızın boyutlarına göre ayarlayın)
    wheel_separation: 0.51  # Sol ve sağ tekerlekler arası mesafe (metre)
    wheel_radius: 0.1  # Tekerlek yarıçapı (metre) - tekerleklerinize uyacak şekilde ayarlayın
    
    # İnce ayar için tekerlek aralığı çarpanı
    wheel_separation_multiplier: 1.0
    
    # Kalibrasyon için sol ve sağ tekerlek yarıçap çarpanları
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # Yayınlama ve odometri ayarları
    publish_rate: 50.0  # Hz
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # Odometriyi etkinleştir
    open_loop: false
    enable_odom_tf: true

    # Zamansız hız komutlarını kullan (TwistStamped yerine Twist)
    use_stamped_vel: false

    # Güvenlik için komut zaman aşımı
    cmd_vel_timeout: 0.5  # 500ms boyunca komut alınmazsa durdur
    
    # Hız ve ivme limitleri
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 2.5  # m/s - hızlı tepki için artırıldı
    linear.x.min_velocity: -2.5  # m/s
    linear.x.max_acceleration: 2.0  # m/s^2 - daha hızlı hızlanma
    linear.x.min_acceleration: -2.5  # m/s^2 - daha güçlü frenleme

    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: false
    angular.z.max_velocity: 10.0  # rad/s - çok daha hızlı dönüş
    angular.z.min_velocity: -10.0  # rad/s
